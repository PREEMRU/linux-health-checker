name: CI

on:
    push:

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
            
            - name: Setup Python
              uses: actions/setup-python@v6
              with:
                python-version: '3.14'
            
            - name: Install uv
              uses: astral-sh/setup-uv@v6

            - name: Run tests with coverage
              run: make coverage

            - name: Run lint
              if: success() || failure()
              run: make lint
            
            - name: Package application
              run: |
                mkdir -p dist/linux-health-checker
                cp health.py Makefile dist/linux-health-checker/
                cp -r deploy dist/linux-health-checker/
                tar -czf dist/linux-health-checker.tar.gz -C dist linux-health-checker

            - name: Generate checksum
              run: |
                cd dist
                sha256sum linux-health-checker.tar.gz > SHA256SUMS

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                name: linux-health-checker
                path: |
                  dist/linux-health-checker.tar.gz
                  dist/SHA256SUMS
                if-no-files-found: error

    deploy:
      needs: test
      if: github.ref == 'refs/heads/main'
      runs-on: ubuntu-latest

      steps:
        - name: Download artifact
          uses: actions/download-artifact@v4
          with:
            name: linux-health-checker
            path: dist

        - name: Verify checksum
          run: |
            cd dist/
            sha256sum -c SHA256SUMS

        - name: Inspect artifact
          run: tar -tzf dist/linux-health-checker.tar.gz

        - name: Connect to Tailscale
          uses: tailscale/github-action@v4
          with:
            authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
            ping: ${{ vars.DEPLOY_HOST }}

        - name: Prepare SSH
          shell: bash
          env:
            DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
            DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
            DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          run: |
            install -m 700 -d ~/.ssh
            umask 077

            test -n "$DEPLOY_KNOWN_HOSTS"
            test -n "$DEPLOY_SSH_KEY"

            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
            printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
            
            test -s ~/.ssh/known_hosts
            test -s ~/.ssh/deploy_key

            stat -c '%a %n' ~/.ssh ~/.ssh/known_hosts ~/.ssh/deploy_key

        - name: Upload artifact
          id: upload
          shell: bash
          env: 
            DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          run: |
            target="deploy@$DEPLOY_HOST"
            ssh_opts=(
              -i "$HOME/.ssh/deploy_key"
              -o IdentitiesOnly=yes
              -o BatchMode=yes
              -o StrictHostKeyChecking=yes
              -o ConnectTimeout=10
            )
            
            remote_dir=$(ssh "${ssh_opts[@]}" "$target" 'mktemp -d')
            scp "${ssh_opts[@]}" dist/linux-health-checker.tar.gz dist/SHA256SUMS "$target:$remote_dir/"
            printf 'remote_dir=%s\n' "$remote_dir" >> "$GITHUB_OUTPUT"

        - name: Install artifact
          env: 
            DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
            REMOTE_DIR: ${{ steps.upload.outputs.remote_dir }}
          shell: bash
          run: |
            test -n "$REMOTE_DIR"
            target="deploy@$DEPLOY_HOST"

            ssh_opts=(
              -i "$HOME/.ssh/deploy_key"
              -o IdentitiesOnly=yes
              -o BatchMode=yes
              -o StrictHostKeyChecking=yes
              -o ConnectTimeout=10
            )
            ssh "${ssh_opts[@]}" "$target" "cd '$REMOTE_DIR' && sha256sum -c SHA256SUMS && tar -xzf linux-health-checker.tar.gz && python3 linux-health-checker/deploy/update.py linux-health-checker"