name: CI

on:
    push:

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
            
            - name: Setup Python
              uses: actions/setup-python@v6
              with:
                python-version: '3.14'
            
            - name: Install uv
              uses: astral-sh/setup-uv@v6

            - name: Run tests with coverage
              run: make coverage

            - name: Run lint
              if: success() || failure()
              run: make lint
            
            - name: Package application
              run: |
                mkdir -p dist/linux-health-checker
                cp health.py Makefile dist/linux-health-checker/
                cp -r deploy dist/linux-health-checker/
                tar -czf dist/linux-health-checker.tar.gz -C dist linux-health-checker

            - name: Generate checksum
              run: |
                cd dist
                sha256sum linux-health-checker.tar.gz > SHA256SUMS

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                name: linux-health-checker
                path: |
                  dist/linux-health-checker.tar.gz
                  dist/SHA256SUMS
                if-no-files-found: error

    deploy:
      needs: test
      if: github.ref == 'refs/heads/main'
      runs-on: ubuntu-latest

      steps:
        - name: Download artifact
          uses: actions/download-artifact@v4
          with:
            name: linux-health-checker
            path: dist

        - name: Verify checksum
          run: |
            cd dist/
            sha256sum -c SHA256SUMS

        - name: Inspect artifact
          run: tar -tzf dist/linux-health-checker.tar.gz

        - name: Connect to Tailscale
          uses: tailscale/github-action@v4
          with:
            authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
            ping: ${{ vars.DEPLOY_HOST }}

        - name: Upload and install artifact on VM
          shell: bash
          env:
            DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
            DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
            DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          run: |
            install -d -m 700 ~/.ssh
            umask 077
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
            printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
            ssh_opts=(
              -i "$HOME/.ssh/deploy_key"
              -o IdentitiesOnly=yes
              -o BatchMode=yes
              -o StrictHostKeyChecking=yes
              -o ConnectTimeout=10
            )

            target="deploy@$DEPLOY_HOST"
            remote_dir=$(ssh "${ssh_opts[@]}" "$target" 'mktemp -d')

            scp "${ssh_opts[@]}" \
              dist/linux-health-checker.tar.gz dist/SHA256SUMS \
              "$target:$remote_dir/"

            ssh "${ssh_opts[@]}" "$target" "bash -s -- '$remote_dir'" <<'REMOTE'
            set -euo pipefail
            cd "$1"
            sha256sum -c SHA256SUMS
            tar -xzf linux-health-checker.tar.gz

            app_dir=/opt/linux-health-checker
            new_file=$(mktemp "$app_dir/.health.py.XXXXXX")
            trap 'rm -f -- "$new_file"' EXIT

            install -m 644 linux-health-checker/health.py "$new_file"
            mv -T -- "$new_file" "$app_dir/health.py"
            sha256sum "$app_dir/health.py"

            before = read_runs(sys.argv[1])
            after = read_runs(sys.argv[2])
            new_ids = after.keys() - before.keys()

            if len(new_ids) != 1:
                sys.exit(f"Expected one new invocation, found {len(new_ids)}")

            invocation_id = next(iter(new_ids))
            messages = after[invocation_id]
            print(f"InvocationID={invocation_id}")
            print("\n".join(messages))

            if "=== SERVER HEALTH REPORT ===" not in messages:
                sys.exit("Missing report header")

            for field in ("CPU:", "RAM:", "Disk:", "SSH:"):
                if not any(line.lstrip().startswith(field) for line in messages):
                    sys.exit(f"Missing report field: {field}")
            PY
            REMOTE