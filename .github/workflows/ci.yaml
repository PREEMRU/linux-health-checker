name: CI

on:
    push:

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
            
            - name: Setup Python
              uses: actions/setup-python@v6
              with:
                python-version: '3.14'
            
            - name: Install uv
              uses: astral-sh/setup-uv@v6

            - name: Run tests with coverage
              run: make coverage

            - name: Run lint
              if: success() || failure()
              run: make lint
            
            - name: Package application
              run: |
                mkdir -p dist/linux-health-checker
                cp health.py Makefile dist/linux-health-checker/
                cp -r deploy dist/linux-health-checker/
                tar -czf dist/linux-health-checker.tar.gz -C dist linux-health-checker

            - name: Generate checksum
              run: |
                cd dist
                sha256sum linux-health-checker.tar.gz > SHA256SUMS

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                name: linux-health-checker
                path: |
                  dist/linux-health-checker.tar.gz
                  dist/SHA256SUMS
                if-no-files-found: error

    deploy:
      needs: test
      if: github.ref == 'refs/heads/main'
      runs-on: ubuntu-latest

      steps:
        - name: Download artifact
          uses: actions/download-artifact@v4
          with:
            name: linux-health-checker
            path: dist

        - name: Verify checksum
          run: |
            cd dist/
            sha256sum -c SHA256SUMS

        - name: Inspect artifact
          run: tar -tzf dist/linux-health-checker.tar.gz

        - name: Connect to Tailscale
          uses: tailscale/github-action@v4
          with:
            authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
            ping: ${{ vars.DEPLOY_HOST }}